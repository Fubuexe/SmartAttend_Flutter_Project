name: smart_attend
description: "SmartAttend — AI-powered attendance & focus detection (Mobile Computing GN341 Final Project)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase backend
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

  # State management
  provider: ^6.1.2

  # AI — Computer Vision
  google_mlkit_face_detection: ^0.10.0   # on-device face detection + head pose + eyes-open
  # tflite_flutter disabled — incompatible with Xcode 26 (arm64 -G flag bug)
  camera: ^0.10.5+9                       # live camera stream
  image: ^4.1.7                           # crop / preprocess faces for the embedder

  # UI helpers
  google_fonts: ^6.2.1
  fl_chart: ^0.66.2
  intl: ^0.19.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
